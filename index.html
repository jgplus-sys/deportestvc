<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Fullscreen</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #000;
            overflow: hidden;
        }
        iframe {
            border: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <iframe class="embed-responsive-item" 
            frameborder="0" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            src="https://ordernap.net/e/pphqytc9kbctj" 
            scrolling="no">
    </iframe>
</body>
</html>
